[project]
name = "barred"
version = "0.1.0"
description = "Benchmark sets for BARRED: Synthetic Training of Custom Policy Guardrails via Asymmetric Debate"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.3.0",
    "google-genai>=1.65.0",
    "huggingface-hub>=0.36.2",
    "jinja2>=3.1.6",
    "langchain-anthropic>=1.3.4",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.17",
    "langchain-google-genai>=4.2.1",
    "langchain-google-vertexai>=3.2.2",
    "langchain-openai>=1.1.10",
    "openai>=2.24.0",
    "packaging>=26.0",
    "pandas>=3.0.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pyyaml>=6.0.3",
    "torch>=2.10.0",
    "unsloth",
]

[tool.uv]
no-build-package = ["unsloth"]
